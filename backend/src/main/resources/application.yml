spring:
  application:
    name: robonet-unificado
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 4000

app:
  termo:
    versao: ${TERMO_VERSAO:0.2}
  exclusao:
    intervalo-ms: ${EXCLUSAO_INTERVALO_MS:3600000}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600000}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}

gmail:
  enabled: ${GMAIL_ENABLED:false}
  sender: ${GMAIL_SENDER:}
  client-id: ${GMAIL_CLIENT_ID:}
  client-secret: ${GMAIL_CLIENT_SECRET:}
  refresh-token: ${GMAIL_REFRESH_TOKEN:}
  code-expiration-seconds: ${GMAIL_CODE_EXPIRATION_SECONDS:600}
  resend-cooldown-seconds: ${GMAIL_RESEND_COOLDOWN_SECONDS:60}
