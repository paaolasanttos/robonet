spring:
  application:
    name: robonet-backend
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:3}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:20000}

  jpa:
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:${SERVER_PORT:4000}}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,http://localhost:8081}
  termo:
    versao: ${APP_TERMO_VERSAO:0.3}
  exclusao:
    intervalo-ms: ${APP_EXCLUSAO_INTERVALO_MS:3600000}

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}
    expiration: ${SECURITY_JWT_EXPIRATION:3600000}
  admin:
    email: ${SECURITY_ADMIN_EMAIL}
    password: ${SECURITY_ADMIN_PASSWORD}

gmail:
  enabled: ${GMAIL_ENABLED:false}
  sender: ${GMAIL_SENDER:}
  client-id: ${GMAIL_CLIENT_ID:}
  client-secret: ${GMAIL_CLIENT_SECRET:}
  refresh-token: ${GMAIL_REFRESH_TOKEN:}
  code-expiration-seconds: ${GMAIL_CODE_EXPIRATION_SECONDS:600}
  resend-cooldown-seconds: ${GMAIL_RESEND_COOLDOWN_SECONDS:60}