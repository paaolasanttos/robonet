spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  cors:
    origins: ${CORS_ORIGINS}
