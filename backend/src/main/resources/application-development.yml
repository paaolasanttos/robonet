spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:robonet}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: ${SHOW_SQL:false}

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}
