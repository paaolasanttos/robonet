spring.application.name=robonet-unificado
server.port=4000

spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

security.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value-please}
security.jwt.expiration=${JWT_EXPIRATION:3600000}
security.admin.email=${ADMIN_EMAIL:robonet.umc@gmail.com}
security.admin.password=${ADMIN_PASSWORD:1234}

gmail.enabled=${GMAIL_ENABLED:false}
gmail.sender=${GMAIL_SENDER:}
gmail.client-id=${GMAIL_CLIENT_ID:}
gmail.client-secret=${GMAIL_CLIENT_SECRET:}
gmail.refresh-token=${GMAIL_REFRESH_TOKEN:}
gmail.code-expiration-seconds=${GMAIL_CODE_EXPIRATION_SECONDS:600}
gmail.resend-cooldown-seconds=${GMAIL_RESEND_COOLDOWN_SECONDS:60}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:robonet}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true