name: robonet

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-development}
      SERVER_PORT: 4000
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Defina SPRING_DATASOURCE_PASSWORD no arquivo .env}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:?Defina SECURITY_JWT_SECRET no arquivo .env}
      SECURITY_ADMIN_EMAIL: ${SECURITY_ADMIN_EMAIL:?Defina SECURITY_ADMIN_EMAIL no arquivo .env}
      SECURITY_ADMIN_PASSWORD: ${SECURITY_ADMIN_PASSWORD:?Defina SECURITY_ADMIN_PASSWORD no arquivo .env}
    ports:
      - "${BACKEND_PORT:-4000}:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend
