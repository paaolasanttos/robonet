spring.application.name=backend-aulas
server.port=4000

spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:robonet}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true